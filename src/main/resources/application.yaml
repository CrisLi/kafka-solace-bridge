spring:
  application:
    name: kafka-solace-bridge
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:kafka-solace-bridge}
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 500
    listener:
      # Required: offsets are acknowledged by the sender threads at the per-partition watermark (PartitionWindow).
      # Any other mode commits ahead of Solace delivery and silently breaks at-least-once.
      ack-mode: manual

solace:
  jms:
    host: ${SOLACE_HOST:tcp://localhost:55555}
    msg-vpn: ${SOLACE_VPN:default}
    client-username: ${SOLACE_USERNAME:default}
    client-password: ${SOLACE_PASSWORD:}
    # reconnect/window settings are applied in SolaceConfig (they are SolConnectionFactory setters)

app:
  kafka:
    topic: ${KAFKA_TOPIC:input}
    concurrency: 2
  solace:
    destinations: ${SOLACE_DESTINATIONS:dest/1,dest/2,dest/3,dest/4,dest/5}
  window:
    # 33k records x ~1.3 KB x 14 partitions per pod ~= 600 MB; sized for a 2 GB pod (see RUNBOOK)
    high: 33000
    low: 16000
  batch:
    size: 200          # Solace default max-messages-per-transaction is 256
    linger: 100ms
  breaker:
    retry-wait: 1m
    max-retries: 3
    open-duration: 5m
  shutdown-drain: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
